<body>

    <aside class="sidebar">

        <header>

            <div>

                <h1>🎯 My Goals</h1>

        <section class="goal-list">

                <p>Progress: 2 / 3 hours</p>

                <div class="progress-bar">

                    <div style="width: 66%;">

                    </div>

                </div>

            </div>


            <div class="goal-card">

                <h2>💻 Complete 5 Coding Problems</h2>

                <p>Progress: 3 / 5 problems</p>

                <div class="progress-bar">

                    <div style="width: 60%;">
                        60%
                    </div>

                </div>

            </div>


            <div class="goal-card">

                <h2>📚 Finish JavaScript Course</h2>

                <p>Progress: 70%</p>

                <div class="progress-bar">

                    <div style="width: 70%;">
                        70%
                    </div>

                </div>

            </div>

        </section>

    </main>
